<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#82b968;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top-pill{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);font:800 11px/1 system-ui;letter-spacing:.12em;color:#eef7e9}.joystick{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.13);backdrop-filter:blur(10px);pointer-events:auto}.joystick:after{content:'MOVE';position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);font-size:10px;letter-spacing:.16em}.stick{position:absolute;left:37px;top:37px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.22);transition:transform .08s ease}.cam-zone{position:absolute;left:35%;right:0;top:0;bottom:0;pointer-events:auto}.update{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 54px);transform:translateX(-50%);padding:8px 12px;border:0;border-radius:999px;background:#efffe9;color:#10170d;font-weight:850;font-size:11px;opacity:0;pointer-events:auto}.update.show{opacity:1}.observer{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 54px);padding:8px 11px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);color:#fff;font:800 10px/1 system-ui;letter-spacing:.12em;pointer-events:auto}.observer-panel{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 96px);width:min(48vw,330px);height:min(42vh,330px);min-width:190px;min-height:170px;border:1px solid rgba(255,255,255,.16);border-radius:16px;overflow:hidden;background:rgba(5,9,12,.86);backdrop-filter:blur(10px);display:none;pointer-events:auto;box-shadow:0 16px 50px rgba(0,0,0,.35)}.observer-panel.show{display:block}.observer-panel canvas{width:100%;height:55%;display:block}.observer-label{position:absolute;left:9px;top:8px;padding:5px 7px;border-radius:7px;background:rgba(0,0,0,.56);font:800 9px/1 system-ui;letter-spacing:.1em;color:#dfe7ff}.observer-help{position:absolute;left:9px;bottom:8px;padding:5px 7px;border-radius:7px;background:rgba(0,0,0,.46);font:700 8px/1.2 system-ui;color:#cbd5e1}.observer-tools{position:absolute;left:0;right:0;bottom:0;height:45%;padding:10px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:7px;background:rgba(0,0,0,.38)}.observer-tools button,.observer-tools input{min-width:0;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font:700 10px system-ui;padding:7px}.observer-tools input{grid-column:1/-1;outline:none}.observer-status{grid-column:1/-1;font:700 9px/1.2 system-ui;color:#b8c6d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.observer-json{position:absolute;left:10px;right:10px;top:calc(55% + 8px);height:30px;overflow:hidden;color:#91a5bd;font:600 8px/1.2 ui-monospace,monospace;pointer-events:none}.observer-panel.agent-open{height:min(62vh,470px)}.observer-panel.agent-open canvas{height:43%}.observer-panel.agent-open .observer-tools{height:57%}.observer-panel.agent-open .observer-json{top:calc(43% + 8px)}
@media(max-width:599px){.joystick{display:block}}@media(min-width:600px){.joystick{display:block}}
</style></head><body><canvas id="game"></canvas><div id="ui"><div class="top-pill">MOBILE BUILDER</div><div id="camZone" class="cam-zone"></div><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><button id="observer" class="observer">OBSERVER</button><div id="observerPanel" class="observer-panel"><canvas id="observerCanvas"></canvas><div class="observer-label">AI OBSERVER</div><div class="observer-help">Frame + world state → agent</div><div id="observerJson" class="observer-json"></div><div class="observer-tools"><input id="agentEndpoint" value="/api/agent" aria-label="Agent endpoint" spellcheck="false"><button id="captureObserver">CAPTURE</button><button id="sendObserver">SEND TO AGENT</button><button id="agentMode">AGENT: OFF</button><div id="observerStatus" class="observer-status">Observer ready — no agent connected</div></div></div><button id="update" class="update">UPDATE AVAILABLE</button></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82b968);scene.fog=new THREE.Fog(0x82b968,55,160);
const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.05,220);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#game'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);
scene.add(new THREE.HemisphereLight(0xffffff,0x567045,1.35));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(20,40,10);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x7fbd66,roughness:1}));ground.rotation.x=-Math.PI/2;ground.name='ground';scene.add(ground);
const grid=new THREE.GridHelper(200,40,0x517743,0x517743);grid.material.transparent=true;grid.material.opacity=.11;grid.name='grid';scene.add(grid);
let px=0,py=1.68,pz=6,yaw=0,pitch=.12,moveX=0,moveY=0,camDown=false,lastX=0,lastY=0;const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyId=null;joy.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joyId=t.identifier;setJoy(t);e.preventDefault()},{passive:false});joy.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joyId)setJoy(t);e.preventDefault()},{passive:false});joy.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}e.preventDefault()},{passive:false});
function setJoy(t){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=44;let dx=t.clientX-cx,dy=t.clientY-cy,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max;m=max}const nx=dx/max,ny=-dy/max,dead=.15,raw=Math.hypot(nx,ny),v=Math.max(0,(raw-dead)/(1-dead));moveX=nx*(v/(raw||1));moveY=ny*(v/(raw||1));stick.style.transform=`translate(${dx}px,${dy}px)`}
const cam=document.querySelector('#camZone');cam.addEventListener('touchstart',e=>{const t=e.changedTouches[0];camDown=true;lastX=t.clientX;lastY=t.clientY},{passive:false});cam.addEventListener('touchmove',e=>{if(!camDown)return;const t=e.changedTouches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;yaw-=dx*.012;pitch=THREE.MathUtils.clamp(pitch-dy*.009,-1.25,1.25);e.preventDefault()},{passive:false});cam.addEventListener('touchend',()=>camDown=false,{passive:false});addEventListener('mousemove',e=>{if(e.buttons){yaw-=e.movementX*.007;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.006,-1.25,1.25)}});
function update(){let ix=moveX,iy=moveY;if(keys.w)iy+=1;if(keys.s)iy-=1;if(keys.a)ix-=1;if(keys.d)ix+=1;const raw=Math.hypot(ix,iy);if(raw>1){ix/=raw;iy/=raw}const mag=Math.min(1,raw),fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),speed=5.5;px+=(fx*iy+rx*ix)*speed*mag/60;pz+=(fz*iy+rz*ix)*speed*mag/60;px=THREE.MathUtils.clamp(px,-96,96);pz=THREE.MathUtils.clamp(pz,-96,96);camera.position.set(px,py,pz);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=-pitch}
const observer=document.querySelector('#observer'),panel=document.querySelector('#observerPanel'),observerCanvas=document.querySelector('#observerCanvas'),statusEl=document.querySelector('#observerStatus'),jsonEl=document.querySelector('#observerJson'),endpointEl=document.querySelector('#agentEndpoint'),captureBtn=document.querySelector('#captureObserver'),sendBtn=document.querySelector('#sendObserver'),agentBtn=document.querySelector('#agentMode');
const observerRenderer=new THREE.WebGLRenderer({canvas:observerCanvas,antialias:true,alpha:true,powerPreference:'low-power'});observerRenderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));observerRenderer.setSize(320,210,false);const observerCamera=new THREE.PerspectiveCamera(55,320/210,.1,240);
let agentEnabled=false,lastObservation=null,lastSend=0;
observer.addEventListener('click',()=>panel.classList.toggle('show'));
function vec(v){return{x:Number(v.x.toFixed(3)),y:Number(v.y.toFixed(3)),z:Number(v.z.toFixed(3))}}
function collectObjects(){const objects=[];scene.traverse(o=>{if(!o.visible||o===grid||o===ground||o.isLight||o===scene)return;if(o.isMesh)objects.push({id:o.uuid,type:o.geometry?.type||'Mesh',name:o.name||'object',position:vec(o.position),rotation:vec(o.rotation),scale:vec(o.scale)})});return objects}
function buildObservation(){return{schema:'mobile-builder-observer/v1',timestamp:new Date().toISOString(),player:{position:{x:Number(px.toFixed(3)),y:Number(py.toFixed(3)),z:Number(pz.toFixed(3))},rotation:{x:Number((-pitch).toFixed(4)),y:Number(yaw.toFixed(4)),z:0}},camera:{position:vec(camera.position),yaw:Number(yaw.toFixed(4)),pitch:Number(pitch.toFixed(4)),fov:camera.fov},objects:collectObjects(),environment:{terrain:'flat',dimensions:[200,200],fog:{near:55,far:160}},viewport:{width:innerWidth,height:innerHeight,pixelRatio:renderer.getPixelRatio()}}}
function updateObserver(){observerCamera.position.set(px+22*Math.sin(yaw+.7),24,pz+22*Math.cos(yaw+.7));observerCamera.lookAt(px,0,pz);observerRenderer.render(scene,observerCamera)}
function captureObservation(){updateObserver();const frame=renderer.domElement.toDataURL('image/jpeg',.72);const observation=buildObservation();observation.visual={mime_type:'image/jpeg',data_url:frame};lastObservation=observation;lastSend=Date.now();jsonEl.textContent=`${observation.objects.length} objects • pos ${px.toFixed(1)}, ${pz.toFixed(1)} • frame ${Math.round(frame.length/1024)}KB`;statusEl.textContent='Captured frame + structured world state';return observation}
async function sendObservation(){const obs=lastObservation||captureObservation();const endpoint=endpointEl.value.trim();if(!endpoint){statusEl.textContent='No agent endpoint configured';return}statusEl.textContent='Sending observation…';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obs)});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json().catch(()=>({}));statusEl.textContent=data.message||data.output||'Agent received observation';}catch(err){statusEl.textContent=`Agent connection failed: ${err.message}`}}
captureBtn.addEventListener('click',captureObservation);sendBtn.addEventListener('click',sendObservation);agentBtn.addEventListener('click',()=>{agentEnabled=!agentEnabled;agentBtn.textContent=`AGENT: ${agentEnabled?'ON':'OFF'}`;statusEl.textContent=agentEnabled?'Continuous observer enabled':'Agent observation paused'});
setInterval(()=>{if(agentEnabled&&panel.classList.contains('show')&&Date.now()-lastSend>2500)sendObservation()},2600);
function loop(){requestAnimationFrame(loop);update();if(panel.classList.contains('show'))updateObserver();renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);const r=observerCanvas.getBoundingClientRect();if(r.width&&r.height){observerRenderer.setSize(Math.max(1,Math.floor(r.width)),Math.max(1,Math.floor(r.height)),false);observerCamera.aspect=r.width/r.height;observerCamera.updateProjectionMatrix()}});
let pulling=false,startY=0;addEventListener('touchstart',e=>{if(e.touches.length===1){pulling=true;startY=e.touches[0].clientY}},{passive:true});addEventListener('touchmove',e=>{if(pulling&&e.touches[0].clientY<startY)pulling=false},{passive:true});addEventListener('touchend',e=>{if(!pulling)return;const dy=e.changedTouches[0].clientY-startY;pulling=false;if(dy>90)forceUpdate()},{passive:true});
async function forceUpdate(){try{const r=await navigator.serviceWorker?.getRegistration('./');if(r)await r.update();if(r?.waiting)r.waiting.postMessage({type:'SKIP_WAITING'});location.reload()}catch{location.reload()}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(r=>{r.addEventListener('updatefound',()=>{const n=r.installing;if(!n)return;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)document.querySelector('#update').classList.add('show')})})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}
</script></body></html>
