<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#82b968;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top-pill{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);font:800 11px/1 system-ui;letter-spacing:.12em;color:#eef7e9}.joystick{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.13);backdrop-filter:blur(10px);pointer-events:auto}.joystick:after{content:'MOVE';position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);font-size:10px;letter-spacing:.16em}.stick{position:absolute;left:37px;top:37px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.22);transition:transform .08s ease}.cam-zone{position:absolute;left:35%;right:0;top:0;bottom:0;pointer-events:auto}.update{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 54px);transform:translateX(-50%);padding:8px 12px;border:0;border-radius:999px;background:#efffe9;color:#10170d;font-weight:850;font-size:11px;opacity:0;pointer-events:auto}.update.show{opacity:1}.observer{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 54px);padding:8px 11px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);color:#fff;font:800 10px/1 system-ui;letter-spacing:.12em;pointer-events:auto}.observer-panel{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 96px);width:min(46vw,230px);height:min(32vh,210px);min-width:150px;min-height:120px;border:1px solid rgba(255,255,255,.16);border-radius:16px;overflow:hidden;background:rgba(5,9,12,.86);backdrop-filter:blur(10px);display:none;pointer-events:none;box-shadow:0 16px 50px rgba(0,0,0,.35)}.observer-panel.show{display:block}.observer-panel canvas{width:100%;height:100%;display:block}.observer-label{position:absolute;left:9px;top:8px;padding:5px 7px;border-radius:7px;background:rgba(0,0,0,.56);font:800 9px/1 system-ui;letter-spacing:.1em;color:#dfe7ff}.observer-help{position:absolute;left:9px;bottom:8px;padding:5px 7px;border-radius:7px;background:rgba(0,0,0,.46);font:700 8px/1.2 system-ui;color:#cbd5e1}.live-monitor{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(270px,62vw);padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(5,9,12,.76);backdrop-filter:blur(12px);box-shadow:0 12px 40px rgba(0,0,0,.28);font-size:9px;pointer-events:none}.live-head{display:flex;align-items:center;justify-content:space-between;font-weight:900;letter-spacing:.12em}.live-dot{width:7px;height:7px;border-radius:50%;background:#8dff79;box-shadow:0 0 10px #8dff79;display:inline-block;margin-right:6px}.live-row{display:flex;justify-content:space-between;margin-top:7px;color:#cbd5e1}.live-row b{color:#fff}.live-phase{margin-top:8px;color:#9ee88f;font-weight:800;letter-spacing:.08em}.live-log{margin-top:6px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:599px){.joystick{display:block}.live-monitor{width:190px;font-size:8px}}@media(min-width:600px){.joystick{display:block}}</style>
</head><body><canvas id="game"></canvas><div id="ui"><div class="top-pill">MOBILE BUILDER</div><div id="camZone" class="cam-zone"></div><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><button id="observer" class="observer">OBSERVER</button><div id="observerPanel" class="observer-panel"><canvas id="observerCanvas"></canvas><div class="observer-label">LIVE AI OBSERVER</div><div class="observer-help">FRAME + TICK + WORLD STATE</div></div><div class="live-monitor" id="liveMonitor"><div class="live-head"><span><i class="live-dot"></i>AGENT LIVE</span><span id="tickRate">0 TICKS</span></div><div class="live-row"><span>PHASE</span><b id="buildPhase">BUILDING</b></div><div class="live-row"><span>POSITION</span><b id="livePos">0.00, 1.68, 6.00</b></div><div class="live-row"><span>CAMERA</span><b id="liveCam">0° / 7°</b></div><div class="live-row"><span>FRAME</span><b id="liveFrame">WAITING</b></div><div class="live-phase" id="liveAction">LIVE TICK LOOP ACTIVE</div><div class="live-log" id="liveLog">Observer is tracking the builder in real time.</div></div><button id="update" class="update">UPDATE AVAILABLE</button></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82b968);scene.fog=new THREE.Fog(0x82b968,55,160);
const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.05,220);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#game'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);
scene.add(new THREE.HemisphereLight(0xffffff,0x567045,1.35));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(20,40,10);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x7fbd66,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(200,40,0x517743,0x517743);grid.material.transparent=true;grid.material.opacity=.11;scene.add(grid);
let px=0,py=1.68,pz=6,yaw=0,pitch=.12,moveX=0,moveY=0,camDown=false,lastX=0,lastY=0;const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyId=null;
joy.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joyId=t.identifier;setJoy(t);e.preventDefault()},{passive:false});joy.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joyId)setJoy(t);e.preventDefault()},{passive:false});joy.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}e.preventDefault()},{passive:false});
function setJoy(t){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=44;let dx=t.clientX-cx,dy=t.clientY-cy,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max;m=max}const nx=dx/max,ny=-dy/max,dead=.15,raw=Math.hypot(nx,ny),v=Math.max(0,(raw-dead)/(1-dead));moveX=nx*(v/(raw||1));moveY=ny*(v/(raw||1));stick.style.transform=`translate(${dx}px,${dy}px)`}
const cam=document.querySelector('#camZone');cam.addEventListener('touchstart',e=>{const t=e.changedTouches[0];camDown=true;lastX=t.clientX;lastY=t.clientY},{passive:false});cam.addEventListener('touchmove',e=>{if(!camDown)return;const t=e.changedTouches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;yaw-=dx*.012;pitch=THREE.MathUtils.clamp(pitch-dy*.009,-1.25,1.25);e.preventDefault()},{passive:false});cam.addEventListener('touchend',()=>camDown=false,{passive:false});addEventListener('mousemove',e=>{if(e.buttons){yaw-=e.movementX*.007;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.006,-1.25,1.25)}});
function update(){let ix=moveX,iy=moveY;if(keys.w)iy+=1;if(keys.s)iy-=1;if(keys.a)ix-=1;if(keys.d)ix+=1;const raw=Math.hypot(ix,iy);if(raw>1){ix/=raw;iy/=raw}const mag=Math.min(1,raw),fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),speed=5.5;px+=(fx*iy+rx*ix)*speed*mag/60;pz+=(fz*iy+rz*ix)*speed*mag/60;px=THREE.MathUtils.clamp(px,-96,96);pz=THREE.MathUtils.clamp(pz,-96,96);camera.position.set(px,py,pz);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=-pitch}
const observer=document.querySelector('#observer'),observerPanel=document.querySelector('#observerPanel'),observerCanvas=document.querySelector('#observerCanvas');const observerRenderer=new THREE.WebGLRenderer({canvas:observerCanvas,antialias:true,alpha:true,powerPreference:'low-power'});observerRenderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));observerRenderer.setSize(320,210,false);const observerCamera=new THREE.PerspectiveCamera(55,320/210,.1,240);observer.addEventListener('click',()=>observerPanel.classList.toggle('show'));function updateObserver(){observerCamera.position.set(px+22*Math.sin(yaw+.7),24,pz+22*Math.cos(yaw+.7));observerCamera.lookAt(px,0,pz);observerRenderer.render(scene,observerCamera)}
// Live observer tick: every simulation frame is recorded; periodic captures package the latest frame with state.
const live={ticks:0,frames:0,lastTick:performance.now(),lastCapture:0,tickHz:0,dirty:false,history:[],captureEvery:250};
const liveMonitor=document.querySelector('#liveMonitor'),tickRate=document.querySelector('#tickRate'),livePos=document.querySelector('#livePos'),liveCam=document.querySelector('#liveCam'),liveFrame=document.querySelector('#liveFrame'),liveAction=document.querySelector('#liveAction'),liveLog=document.querySelector('#liveLog');
function serializeWorld(){return {timestamp:Date.now(),tick:live.ticks,player:{position:{x:+px.toFixed(4),y:+py.toFixed(4),z:+pz.toFixed(4)},moving:Math.abs(moveX)+Math.abs(moveY)>0.02},camera:{yaw:+yaw.toFixed(5),pitch:+pitch.toFixed(5),position:{x:+camera.position.x.toFixed(4),y:+camera.position.y.toFixed(4),z:+camera.position.z.toFixed(4)}},viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio||1},environment:{terrain:'flat',dimensions:[200,200],objects:scene.children.filter(o=>o.isMesh).length}}}
function captureObservation(){const state=serializeWorld();let frame=null;try{frame=renderer.domElement.toDataURL('image/jpeg',.55)}catch{}const observation={type:'mobile-builder-observation',version:1,state,frame};live.frames++;live.lastCapture=performance.now();live.dirty=false;liveFrame.textContent='CAPTURED';liveAction.textContent='FRAME + STATE READY';liveLog.textContent=`Tick ${live.ticks.toLocaleString()} • ${state.player.moving?'MOVING':'IDLE'} • ${state.environment.objects} scene objects`;window.dispatchEvent(new CustomEvent('mobile-builder-observation',{detail:observation}));return observation}
function liveTick(now){live.ticks++;live.dirty=true;const dt=now-live.lastTick;live.lastTick=now;if(dt>0)live.tickHz=live.tickHz*.9+(1000/dt)*.1;if(now-live.lastCapture>=live.captureEvery)captureObservation();livePos.textContent=`${px.toFixed(2)}, ${py.toFixed(2)}, ${pz.toFixed(2)}`;liveCam.textContent=`${THREE.MathUtils.radToDeg(yaw).toFixed(0)}° / ${THREE.MathUtils.radToDeg(pitch).toFixed(0)}°`;tickRate.textContent=`${live.tickHz.toFixed(0)} TICKS/S`;live.history.push({t:Date.now(),x:px,y:py,z:pz,yaw,pitch,moving:Math.abs(moveX)+Math.abs(moveY)>0.02});if(live.history.length>120)live.history.shift()}
window.MobileBuilderObserver={getState:serializeWorld,capture:captureObservation,getHistory:()=>live.history.slice(-120),isLive:()=>true};
function loop(now){requestAnimationFrame(loop);update();liveTick(now);if(observerPanel.classList.contains('show'))updateObserver();renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);const r=observerPanel.getBoundingClientRect();if(r.width&&r.height){observerRenderer.setSize(Math.max(1,Math.floor(r.width)),Math.max(1,Math.floor(r.height)),false);observerCamera.aspect=r.width/r.height;observerCamera.updateProjectionMatrix()}});
let pulling=false,startY=0;addEventListener('touchstart',e=>{if(e.touches.length===1){pulling=true;startY=e.touches[0].clientY}},{passive:true});addEventListener('touchmove',e=>{if(pulling&&e.touches[0].clientY<startY)pulling=false},{passive:true});addEventListener('touchend',e=>{if(!pulling)return;const dy=e.changedTouches[0].clientY-startY;pulling=false;if(dy>90)forceUpdate()},{passive:true});
async function forceUpdate(){try{const r=await navigator.serviceWorker?.getRegistration('./');if(r)await r.update();if(r?.waiting)r.waiting.postMessage({type:'SKIP_WAITING'});location.reload()}catch{location.reload()}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(r=>{r.addEventListener('updatefound',()=>{const n=r.installing;if(!n)return;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)document.querySelector('#update').classList.add('show')})})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}
</script></body></html>
